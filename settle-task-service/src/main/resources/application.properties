server.port=${SETTLE_TASK_SERVICE_PORT:8101}

spring.application.name=settle-task-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/exchange_clear?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:3000ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3000ms}

spring.sql.init.mode=never

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.wuxx.exchangeclear
mybatis.configuration.map-underscore-to-camel-case=true

rocketmq.name-server=${ROCKETMQ_NAME_SERVER:localhost:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:exchange-clear-file-generate-producer-group}
rocketmq.producer.send-message-timeout=${ROCKETMQ_SEND_MESSAGE_TIMEOUT:3000}
rocketmq.producer.retry-times-when-send-failed=${ROCKETMQ_RETRY_TIMES_WHEN_SEND_FAILED:2}

exchange-clear.mq.topic.file-generate-task=${EXCHANGE_CLEAR_MQ_FILE_GENERATE_TOPIC:file-generate-task}
exchange-clear.mq.tag.trade=${EXCHANGE_CLEAR_MQ_TRADE_TAG:TRADE}
exchange-clear.task.file-generate-client=${EXCHANGE_CLEAR_TASK_FILE_GENERATE_CLIENT:feign}
exchange-clear.lock.task-resend.wait-seconds=${EXCHANGE_CLEAR_TASK_RESEND_LOCK_WAIT_SECONDS:3}
exchange-clear.lock.task-resend.lease-seconds=${EXCHANGE_CLEAR_TASK_RESEND_LOCK_LEASE_SECONDS:30}

feign.client.config.default.loggerLevel=basic
feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:3000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:5000}
