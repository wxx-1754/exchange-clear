server.port=${EXCHANGE_GATEWAY_PORT:9002}

spring.application.name=exchange-gateway
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=settle-task-service
spring.cloud.gateway.routes[0].uri=lb://settle-task-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/tasks/**,/internal/tasks/**

spring.cloud.gateway.routes[1].id=settle-file-service
spring.cloud.gateway.routes[1].uri=lb://settle-file-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/files/**,/internal/files/**

spring.cloud.gateway.routes[2].id=settle-worker-service
spring.cloud.gateway.routes[2].uri=lb://settle-worker-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/internal/workers/**

spring.cloud.gateway.routes[3].id=settle-download-service
spring.cloud.gateway.routes[3].uri=lb://settle-download-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/download/**

spring.cloud.gateway.routes[4].id=settle-mock-service
spring.cloud.gateway.routes[4].uri=lb://settle-mock-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/mock/**
