server.port=8104

spring.application.name=settle-download-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:exchange-clear}

exchange-clear.file.metadata-client=${EXCHANGE_CLEAR_FILE_METADATA_CLIENT:feign}

feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:3000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:5000}
