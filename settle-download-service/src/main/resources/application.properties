server.port=8104

spring.application.name=settle-download-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:3000ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3000ms}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:exchange-clear}

exchange-clear.file.metadata-client=${EXCHANGE_CLEAR_FILE_METADATA_CLIENT:feign}

feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:3000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:5000}

exchange-clear.download.token-expire-seconds=${EXCHANGE_CLEAR_DOWNLOAD_TOKEN_EXPIRE_SECONDS:300}
exchange-clear.download.one-time-token=${EXCHANGE_CLEAR_DOWNLOAD_ONE_TIME_TOKEN:false}
exchange-clear.download.bind-ip=${EXCHANGE_CLEAR_DOWNLOAD_BIND_IP:false}
exchange-clear.download.allowed-statuses[0]=GENERATED

exchange-clear.limit.fail-open=${EXCHANGE_CLEAR_LIMIT_FAIL_OPEN:true}
exchange-clear.limit.member.enabled=${EXCHANGE_CLEAR_LIMIT_MEMBER_ENABLED:true}
exchange-clear.limit.member.permits-per-second=${EXCHANGE_CLEAR_LIMIT_MEMBER_PERMITS_PER_SECOND:5}
exchange-clear.limit.ip.enabled=${EXCHANGE_CLEAR_LIMIT_IP_ENABLED:true}
exchange-clear.limit.ip.permits-per-second=${EXCHANGE_CLEAR_LIMIT_IP_PERMITS_PER_SECOND:10}
