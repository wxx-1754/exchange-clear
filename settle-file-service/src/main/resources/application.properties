server.port=${SETTLE_FILE_SERVICE_PORT:8102}

spring.application.name=settle-file-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/exchange_clear?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:3000ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3000ms}

spring.sql.init.mode=never

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.wuxx.exchangeclear
mybatis.configuration.map-underscore-to-camel-case=true

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:exchange-clear}

rocketmq.name-server=${ROCKETMQ_NAME_SERVER:localhost:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:file-status-event-producer-group}

feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:3000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:5000}

exchange-clear.cache.file-list.ttl-seconds=${EXCHANGE_CLEAR_FILE_LIST_CACHE_TTL_SECONDS:600}
exchange-clear.cache.file-list.null-ttl-seconds=${EXCHANGE_CLEAR_FILE_LIST_CACHE_NULL_TTL_SECONDS:60}
exchange-clear.cache.file-meta.ttl-seconds=${EXCHANGE_CLEAR_FILE_META_CACHE_TTL_SECONDS:1800}
exchange-clear.cache.file-meta.null-ttl-seconds=${EXCHANGE_CLEAR_FILE_META_CACHE_NULL_TTL_SECONDS:60}
exchange-clear.lock.cache.wait-millis=${EXCHANGE_CLEAR_CACHE_LOCK_WAIT_MILLIS:100}
exchange-clear.lock.cache.lease-seconds=${EXCHANGE_CLEAR_CACHE_LOCK_LEASE_SECONDS:10}
exchange-clear.publish.check-task-complete=${EXCHANGE_CLEAR_PUBLISH_CHECK_TASK_COMPLETE:true}
exchange-clear.publish.check-file-meta=${EXCHANGE_CLEAR_PUBLISH_CHECK_FILE_META:true}
exchange-clear.publish.check-minio-exists=${EXCHANGE_CLEAR_PUBLISH_CHECK_MINIO_EXISTS:true}
exchange-clear.publish.lock-wait-seconds=${EXCHANGE_CLEAR_PUBLISH_LOCK_WAIT_SECONDS:3}
exchange-clear.publish.lock-lease-seconds=${EXCHANGE_CLEAR_PUBLISH_LOCK_LEASE_SECONDS:300}
exchange-clear.revoke.lock-wait-seconds=${EXCHANGE_CLEAR_REVOKE_LOCK_WAIT_SECONDS:3}
exchange-clear.revoke.lock-lease-seconds=${EXCHANGE_CLEAR_REVOKE_LOCK_LEASE_SECONDS:60}
exchange-clear.reissue.lock-wait-seconds=${EXCHANGE_CLEAR_REISSUE_LOCK_WAIT_SECONDS:3}
exchange-clear.reissue.lock-lease-seconds=${EXCHANGE_CLEAR_REISSUE_LOCK_LEASE_SECONDS:60}
exchange-clear.local-message.status-event-topic=${EXCHANGE_CLEAR_FILE_STATUS_EVENT_TOPIC:file.status.event}
exchange-clear.local-message.file-generate-task-topic=${EXCHANGE_CLEAR_FILE_GENERATE_TASK_TOPIC:file.generate.task}
exchange-clear.local-message.retry-interval-seconds=${EXCHANGE_CLEAR_LOCAL_MESSAGE_RETRY_INTERVAL_SECONDS:60}
exchange-clear.local-message.max-retry-count=${EXCHANGE_CLEAR_LOCAL_MESSAGE_MAX_RETRY_COUNT:5}
exchange-clear.local-message.batch-size=${EXCHANGE_CLEAR_LOCAL_MESSAGE_BATCH_SIZE:100}

exchange-clear.reconcile.local-message-enabled=${EXCHANGE_CLEAR_RECONCILE_LOCAL_MESSAGE_ENABLED:true}
exchange-clear.reconcile.local-message-delay-millis=${EXCHANGE_CLEAR_RECONCILE_LOCAL_MESSAGE_DELAY_MILLIS:60000}
exchange-clear.reconcile.file-state-enabled=${EXCHANGE_CLEAR_RECONCILE_FILE_STATE_ENABLED:true}
exchange-clear.reconcile.file-state-delay-millis=${EXCHANGE_CLEAR_RECONCILE_FILE_STATE_DELAY_MILLIS:300000}
exchange-clear.reconcile.minio-check-enabled=${EXCHANGE_CLEAR_RECONCILE_MINIO_CHECK_ENABLED:true}
exchange-clear.reconcile.minio-check-days=${EXCHANGE_CLEAR_RECONCILE_MINIO_CHECK_DAYS:7}
exchange-clear.reconcile.minio-check-delay-millis=${EXCHANGE_CLEAR_RECONCILE_MINIO_CHECK_DELAY_MILLIS:300000}
exchange-clear.reconcile.lock-wait-seconds=${EXCHANGE_CLEAR_RECONCILE_LOCK_WAIT_SECONDS:1}
exchange-clear.reconcile.lock-lease-seconds=${EXCHANGE_CLEAR_RECONCILE_LOCK_LEASE_SECONDS:120}
